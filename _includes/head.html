<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
{% if page.de and page.en %}<link rel="alternate" hreflang="de" href="{{ site.url }}{{ page.de }}">
<link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.en }}">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.de }}">
{% endif %}<meta property="og:type" content="website">
<meta property="og:site_name" content="Kilowa">
<meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
{% if page.description %}<meta property="og:description" content="{{ page.description | escape }}">{% endif %}
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% else %}de_CH{% endif %}">
<meta name="twitter:card" content="summary_large_image">
{% if site.appstore_id and site.appstore_id != "" %}<meta name="apple-itunes-app" content="app-id={{ site.appstore_id }}">
{% endif %}<meta name="theme-color" content="#F4F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
